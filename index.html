<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Currency Converter</h2>
        <div class="converter-cont">
            <form>
                <div class="form">
                <p id="text">Enter Amount</p>
                
                <input value="100" id="input" type="text">
                <div class="dropdown">
                    <div class="from">
                
                <p id="from">From</p>
                <div class="select-container">
                <img src="https://flagsapi.com/US/shiny/64.png" id="flag1">
                <select name="from" id="fromCurrency"></select>
                </div>
                </div>
                
                <div class="to">
                <p id="to">To</p>
                <div class="select-container">
                <img src="https://flagsapi.com/IN/shiny/64.png" id="flag2">
                <select name="to" id="toCurrency"></select>
                </div>
                </div>
                </div>
                <button id="btn">Convert</button>
        <div class="msg">
            <p id="msgText">1 USD = 95 INR</p>
        </div>
                </div>
            </form>
        </div>
        
    </div>
    <script src="currencies.js"></script>
    <script src="script.js"></script>
</body>
</html>
