<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Currency Converter</h2>
        <div class="converter-cont">
            <form>
                <div class="form">
                <p id="text">Enter Amount</p>
                <br>
                <input value="100" id="input" type="text">
                <div class="dropdown">
                    <div class="from">
                <!-- <br>
                <br> -->
                <p id="from">From</p>
                <div class="select-container">
                <img src="https://flagsapi.com/US/shiny/64.png">
                <select name="from" id="fromCurrency">
                    <option value="USD">USD</option>
                    <option value="AUD">AUD</option>
                    <option value="CAD">CAD</option>
                    <option value="BRL">BRL</option>
                    <option value="INR">INR</option>
                </select>
                </div>
                </div>
                
                <!-- <br>
                <br> -->
                <div class="to">
                <p id="to">To</p>
                <div class="select-container">
                <img src="https://flagsapi.com/IN/shiny/64.png">
                <select name="to" id="toCurrency">
                    <option value="INR">INR</option>
                    <option value="AUD">AUD</option>
                    <option value="CAD">CAD</option>
                    <option value="BRL">BRL</option>
                    <option value="USD">USD</option>
                </select>
                </div>
                </div>
                </div>
                <button id="btn">Convert</button>
        <div class="msg">
            <p id="msgText">1 USD = 95 INR</p>
        </div>
                </div>
            </form>
        </div>
        <!-- <br> -->
        
        <!-- <div class="msg">
            <p>1 USD = 95 INR</p>
        </div> -->
        <!-- <br> -->
        <!-- <button id="btn"hover>Convert</button> -->
        
    </div>
    <script src="script.js"></script>
</body>
</html>
